<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>¿Jugamos? · Juegos para quedadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e1f;--bg2:#16183a;--card:#1d2048;--line:#2c3068;--txt:#f3f3ff;--mut:#a6a9d6;
  --pri:#ff5c8a;--pri2:#ff9a5c;--ok:#22c58b;--bad:#ff4d5e;--no:#5a5f9e;--yel:#ffd23f;--cy:#3fd6ff;--vi:#a06bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1d5c 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#3a1640 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
.hero{text-align:center;padding:18px 0 8px}
.hero .logo{font-size:52px;animation:bob 3s ease-in-out infinite}
.hero h1{font-size:44px;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--yel));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:4px 0 0}
@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.panel{background:rgba(29,32,72,.75);border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:24px;font-weight:800}
.stepper b{min-width:34px;text-align:center;font-size:22px;font-family:"Baloo 2"}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.names input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);font-weight:700}
.names input:focus{outline:2px solid var(--pri);border-color:transparent}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec h3{font-size:22px}
.sec span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{position:relative;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:20px;padding:14px 12px 12px;min-height:128px;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.gc:active{transform:scale(.96)}
.gc .ic{font-size:30px}
.gc h4{margin:2px 0 0;font-family:"Baloo 2";font-size:18px;line-height:1.1}
.gc p{margin:0;color:var(--mut);font-size:12.5px;line-height:1.3}
.gc .bd{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:999px}
.gc.off{opacity:.38;filter:grayscale(.6)}
.gc .star{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;background:var(--yel);color:#2a2000;padding:3px 7px;border-radius:999px}
.random{width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--vi),var(--pri));box-shadow:0 8px 24px -8px var(--pri)}
/* game screen */
.gh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.gh h2{flex:1;font-size:22px;text-align:center}
.gh button{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:18px;background:var(--card);border:1px solid var(--line);margin-top:10px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--pri),var(--pri2));border:0;box-shadow:0 8px 24px -10px var(--pri)}
.btn.ok{background:var(--ok);border:0;color:#03271a}
.btn.bad{background:var(--bad);border:0}
.btn.no{background:var(--no);border:0}
.btn.ghost{background:transparent}
.btn.xl{padding:20px;font-size:20px}
.btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:6px}
.btns .btn{margin-top:0;padding:22px 8px}
.center{text-align:center}
.pass{text-align:center;padding-top:8vh}
.pass .emoji{font-size:64px;animation:bob 2s infinite}
.pass p{color:var(--mut);margin:10px 0 0;font-size:18px}
.pass h1{font-size:48px;margin:6px 0 4px;color:var(--yel)}
.pass .sub{font-size:16px;max-width:340px;margin:8px auto 28px}
.secret{font-family:"Baloo 2";font-size:44px;margin:14px 0;padding:24px;border-radius:24px;background:var(--card);border:2px dashed var(--pri)}
.count{font-family:"Baloo 2";font-size:160px;text-align:center;margin-top:16vh;animation:pop .8s ease-out infinite;color:var(--yel)}
@keyframes pop{0%{transform:scale(1.4);opacity:.3}30%{transform:scale(1);opacity:1}}
.card{background:linear-gradient(160deg,#272b63,#1b1e47);border:1px solid var(--line);border-radius:26px;padding:22px;text-align:center;margin:12px 0}
.card.big{min-height:38vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card .w{font-family:"Baloo 2";font-size:clamp(34px,10vw,54px);line-height:1.05}
.card .hint{color:var(--mut);margin-top:10px;font-weight:700}
.card .txt{font-size:24px;font-weight:800;line-height:1.3}
.forb{margin-top:16px;display:flex;flex-direction:column;gap:6px;width:100%}
.forb span{background:rgba(255,77,94,.15);color:#ff98a2;border-radius:10px;padding:6px;font-weight:800;font-size:18px}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tbar .who{font-weight:800;color:var(--yel)}
.timer{font-family:"Baloo 2";font-size:40px;min-width:70px;text-align:center}
.timer.hot{color:var(--bad);animation:pop 1s infinite}
.pts{font-family:"Baloo 2";font-size:26px;background:var(--card);border-radius:12px;padding:0 12px}
.res{text-align:center}
.res h1{font-size:56px;color:var(--yel)}
.log{list-style:none;padding:0;margin:14px 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.log li{background:var(--card);padding:6px 10px;border-radius:10px;font-weight:700;font-size:14px}
.log li.ok{background:rgba(34,197,139,.2);color:#7cf0c4}
.log li.bad{background:rgba(255,77,94,.2);color:#ff98a2}
.board{list-style:none;padding:0;margin:10px 0;text-align:left}
.board li{display:flex;justify-content:space-between;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-weight:800}
.board li b{font-family:"Baloo 2";font-size:20px}
.lbl{color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin:6px 0}
.sub{color:var(--mut)}
.q{font-size:28px;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;font-weight:800;font-size:18px}
.opt:active,.opt.sel{background:var(--vi)}
.opt.good{background:var(--ok);color:#03271a}
.opt.wrong{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:800}
.chip.on{background:var(--pri);border-color:var(--pri)}
.chip small{opacity:.75;margin-left:4px}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--txt)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;font-weight:800}
.cats button.on{background:var(--vi);border-color:var(--vi)}
.stats{margin-top:14px;color:var(--mut);font-weight:700}
.vs{display:grid;gap:10px;margin:12px 0}
.vs button{border-radius:22px;padding:24px 16px;font-weight:800;font-size:21px;line-height:1.25;position:relative;overflow:hidden}
.vs button:first-child{background:linear-gradient(135deg,#3b5bff,#7a5cff)}
.vs button:last-child{background:linear-gradient(135deg,#ff5c8a,#ff9a5c)}
.vs .or{font-family:"Baloo 2";text-align:center;color:var(--mut);font-size:18px}
.vs .n{display:block;font-size:14px;opacity:.85;margin-top:6px}
/* onda */
.spec{margin:18px 0}
.spec .bar{position:relative;height:70px;border-radius:18px;background:linear-gradient(90deg,#3fd6ff,#a06bff 50%,#ff5c8a);overflow:hidden}
.spec .z{position:absolute;top:0;bottom:0}
.spec .z2{background:rgba(255,255,255,.28)}
.spec .z3{background:rgba(255,255,255,.5)}
.spec .z4{background:#fff}
.spec .needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--yel);box-shadow:0 0 0 3px #0d0e1f;border-radius:4px;transition:left .1s}
.spec .ends{display:flex;justify-content:space-between;margin-top:8px;font-weight:800;font-size:18px}
.spec .ends span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:9px;background:var(--bg2);margin:8px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--yel);border:4px solid #0d0e1f}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--yel);border:4px solid #0d0e1f}
/* dibujo */
canvas#cv{width:100%;height:calc(100vh - 330px);min-height:280px;background:#fff;border-radius:20px;touch-action:none;display:block;margin:8px 0}
.pal{display:flex;gap:8px;justify-content:center;margin-top:8px}
.pal button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.pal button.on{border-color:var(--yel)}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
/* bomba */
.bomb{font-size:130px;text-align:center;margin:20px 0;animation:shake .3s infinite}
@keyframes shake{25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg)}}
.boom{font-size:150px;text-align:center;margin-top:6vh;animation:pop .6s}
/* conecta 4 */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#2847d6;padding:8px;border-radius:20px;margin:12px 0}
.c4 button{aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.c4 .p1{background:#ff4d5e}.c4 .p2{background:var(--yel)}
.c4 .win{box-shadow:0 0 0 4px #fff}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;margin-right:6px}
/* reflejos */
.duel{display:grid;grid-template-rows:1fr 1fr;gap:10px;height:calc(100vh - 110px)}
.half{border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:10px}
.half.top{transform:rotate(180deg)}
.half h3{font-size:30px}
.half .sc{font-family:"Baloo 2";font-size:60px;line-height:1}
.half .m{color:var(--mut);font-weight:800;margin-top:6px;font-size:18px}
.duel.go .half{background:var(--ok);color:#03271a}
.duel.go .half .m{color:#03271a}
/* misc */
.modal{position:fixed;inset:0;background:rgba(5,6,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
.modal .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;width:100%;max-height:85vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:28px;margin-bottom:6px}
.sheet ol,.sheet ul{padding-left:20px;line-height:1.5}
.tag{display:inline-block;background:var(--card);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;margin:2px 4px 2px 0}
.intro .ic{font-size:70px;text-align:center}
.intro h1{text-align:center;font-size:38px}
.intro .tags{text-align:center;margin:10px 0}
.intro .rules{background:var(--card);border-radius:20px;padding:6px 18px;margin:14px 0;line-height:1.5}
.step{background:var(--card);border-radius:18px;padding:16px;margin:8px 0;border:1px solid var(--line);opacity:.45}
.step.cur{opacity:1;border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.roles button{background:var(--card);border-radius:12px;padding:10px;text-align:left;font-weight:800}
.roles button.dead{opacity:.35;text-decoration:line-through}
.win-msg{background:var(--yel);color:#2a2000;border-radius:16px;padding:12px;font-weight:800;text-align:center;margin:10px 0}
.conf{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
.slot{font-family:"Baloo 2";font-size:40px;text-align:center;padding:40px 0}
.btn:disabled{opacity:.4}
.tin{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font-weight:700;margin:6px 0;font-size:16px}
.tin:focus{outline:2px solid var(--pri);border-color:transparent}
.nv{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:12px 0}
.nv button,.nv div{aspect-ratio:1;border-radius:8px;background:#12356b;font-size:16px;display:flex;align-items:center;justify-content:center;color:#7d9bd1}
.nv .ship{background:#9db0d1}.nv .miss{background:#0b1f42}.nv .hit{background:#ff9a5c}.nv .sunk{background:var(--bad)}
canvas#hk{width:100%;height:calc(100vh - 110px);min-height:420px;touch-action:none;border-radius:22px;display:block;background:#0b1030;border:1px solid var(--line)}
.slots{display:flex;justify-content:center;gap:8px;margin:14px 0}
.slots button{font-size:38px;width:60px;height:60px;border-radius:16px;background:var(--card);line-height:1}
.slots.pal2{gap:6px}.slots.pal2 button{font-size:30px;width:50px;height:50px}
.hrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:6px 14px;margin:6px 0;font-size:22px}
.hrow b{letter-spacing:2px;color:var(--yel);font-size:18px}
.buzz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.buzz button{padding:26px 8px;border-radius:22px;font-weight:800;font-size:19px;color:#fff;touch-action:manipulation}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mem button{aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,var(--vi),var(--pri));font-size:0;line-height:1}
.mem button.up{background:var(--card);font-size:34px}
.mem button.done{opacity:.35}
.dots{display:grid;grid-template-columns:repeat(4,22px 1fr) 22px;grid-template-rows:repeat(4,22px 1fr) 22px;aspect-ratio:1;margin:12px 0}
.dots .d{background:#fff;border-radius:50%;margin:5px}
.dots .lh{padding:7px 0;background-clip:content-box;background-color:var(--line);border-radius:4px}
.dots .lv{padding:0 7px;background-clip:content-box;background-color:var(--line);border-radius:4px}
.dots .b{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#0d0e1f}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:12px 0}
.kb button{padding:12px 0;border-radius:10px;background:var(--card);font-weight:800}
.kb button.g{opacity:.25}
.kb button.okk{background:var(--ok);color:#03271a}
.hw{font-family:"Baloo 2";font-size:30px;letter-spacing:5px;margin:10px 0;display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:center}
.hw span{white-space:nowrap}
.dice{font-size:56px;letter-spacing:4px;line-height:1.2;margin:16px 0}
.drow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:4px 14px;margin:6px 0;font-weight:800}
.drow span:last-child{font-size:30px}
.cw{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
.cw button{aspect-ratio:1.2;border-radius:10px;background:#e9e4d4;color:#222;font-weight:800;font-size:10.5px;padding:2px;overflow:hidden;word-break:break-word;line-height:1.1}
.cw .R{background:#e23c4b;color:#fff}.cw .B{background:#3b6cf0;color:#fff}.cw .N{background:#8a8570;color:#fff}.cw .X{background:#111;color:#fff;outline:1px solid #555}
</style>
</head>

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const deck=arr=>{let d=[];return()=>{if(!d.length)d=shuffle(arr.slice());return d.pop()}};
let cleanup=[];const clearAll=()=>{cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[]};
const every=(ms,fn)=>{const id=setInterval(fn,ms);const s=()=>clearInterval(id);cleanup.push(s);return s};

let AC;function beep(f=660,d=.08,type='sine',vol=.12){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03)}catch(e){}}

function P(){const seen={};return S.names.map((n,i)=>{let v=(n||'').trim()||('Jugador '+(i+1));if(seen[v]){seen[v]++;v=v+' '+seen[v]}else seen[v]=1;return v})}
const zero=()=>{const o={};P().forEach(p=>o[p]=0);return o};
function boardHTML(sc,low){const arr=Object.entries(sc).sort((a,b)=>low?a[1]-b[1]:b[1]-a[1]);return `<ol class="board">${arr.map(([n,v],i)=>`<li><span>${i===0&&(low||v>0)?'👑 ':''}${esc(n)}</span><b>${v}</b></li>`).join('')}</ol>`}

/* pantallas */
let H={},CUR=null;
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='__back'){home();return}
  if(a==='__rules'){rules(CUR);return}
  const f=H[a];if(f)f(t,e)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))$('#modal').innerHTML=''});
function screen(g,body,h){clearAll();CUR=g;H=h||{};app.innerHTML=`<header class="gh"><button data-a="__back" aria-label="Volver">‹</button><h2>${g.icon} ${g.name}</h2><button data-a="__rules" aria-label="Reglas">?</button></header><main>${body}</main>`;window.scrollTo(0,0)}
function rules(g){if(!g)return;$('#modal').innerHTML=`<div class="modal" id="modal-bg"><div class="sheet"><h2>${g.icon} ${g.name}</h2><div>${g.rules}</div><button class="btn primary" data-close>Entendido</button></div></div>`;$('#modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')$('#modal').innerHTML=''})}
function passScreen(g,name,sub,cb){screen(g,`<div class="pass"><div class="emoji">📱</div><p>Pasa el móvil a</p><h1>${esc(name)}</h1><p class="sub">${sub||''}</p><button class="btn primary xl" data-a="ok">Soy ${esc(name)} 👍</button></div>`,{ok:cb})}
function countdown(g,cb){let n=3;screen(g,`<div class="count" id="cn">3</div>`);beep(520);const st=every(800,()=>{n--;const el=$('#cn');if(n>0){if(el)el.textContent=n;beep(520)}else{st();beep(990,.25);cb()}})}
function pickChips(names,multi){return `<div class="chips">${names.map((n,i)=>`<button class="chip" data-a="chip" data-i="${i}">${esc(n)}</button>`).join('')}</div>`}

/* ================= MOTOR DE RONDAS CON TIEMPO ================= */
function timedGame(g,cfg){
  const sc=zero();let turn=0;
  const next=()=>{const name=P()[turn%P().length];passScreen(g,name,cfg.intro(name),()=>countdown(g,()=>play(name)))};
  function play(name){
    let left=cfg.seconds;const log=[];let card=cfg.pick();
    screen(g,`<div class="tbar"><span class="who">${esc(name)}</span><span class="timer" id="tm">${left}</span><span class="pts" id="pt">0</span></div><div class="card big" id="cd">${cfg.card(card)}</div><div class="btns">${cfg.btns.map((b,i)=>`<button class="btn ${b[2]}" data-a="b" data-i="${i}">${b[0]}</button>`).join('')}</div>`,{
      b:t=>{const b=cfg.btns[+t.dataset.i];log.push([card,b[1]]);sc[name]+=b[1];beep(b[1]>0?880:b[1]<0?180:330);vib(25);card=cfg.pick();$('#cd').innerHTML=cfg.card(card);$('#pt').textContent=log.reduce((a,x)=>a+x[1],0)}
    });
    const st=every(1000,()=>{left--;const tm=$('#tm');if(tm){tm.textContent=Math.max(0,left);if(left<=5)tm.classList.add('hot')}
      if(left<=5&&left>0)beep(700,.05);
      if(left<=0){st();beep(200,.5,'sawtooth');vib([200,100,200]);end(name,log)}});
  }
  function end(name,log){turn++;const tot=log.reduce((a,x)=>a+x[1],0);
    screen(g,`<div class="res"><p class="lbl">¡Tiempo! · ${esc(name)}</p><h1>${tot} punto${Math.abs(tot)===1?'':'s'}</h1><ul class="log">${log.map(([c,p])=>`<li class="${p>0?'ok':p<0?'bad':''}">${p>0?'✓':p<0?'✗':'→'} ${esc(cfg.label?cfg.label(c):c)}</li>`).join('')||'<li>Ninguna</li>'}</ul><h3>Marcador</h3>${boardHTML(sc)}<button class="btn primary xl" data-a="n">Siguiente: ${esc(P()[turn%P().length])}</button><button class="btn ghost" data-a="h">Terminar</button></div>`,{n:next,h:home});
    if(tot>0)confetti();
  }
  next();
}
function setupScreen(g,opts,cb){
  // opts: {cats:bool, time:[..], extra:html}
  let cat='mix',secs=opts.time?opts.time[1]:60;
  const catList=opts.cats||[];
  screen(g,`${catList.length?`<p class="lbl">Categoría</p><div class="cats">${catList.map(c=>`<button data-a="cat" data-id="${c.id}">${c.icon} ${c.name}</button>`).join('')}<button data-a="cat" data-id="mix" class="on">🎲 Mezcla</button></div>`:''}
   ${opts.time?`<p class="lbl" style="margin-top:16px">Tiempo por turno</p><div class="seg">${opts.time.map(t=>`<button data-a="tm" data-t="${t}" class="${t===secs?'on':''}">${t} s</button>`).join('')}</div>`:''}
   ${opts.extra||''}<button class="btn primary xl" data-a="go" style="margin-top:20px">¡Empezar!</button>`,{
    cat:t=>{cat=t.dataset.id;document.querySelectorAll('[data-a=cat]').forEach(b=>b.classList.toggle('on',b===t))},
    tm:t=>{secs=+t.dataset.t;document.querySelectorAll('[data-a=tm]').forEach(b=>b.classList.toggle('on',b===t))},
    go:()=>{const c=cat==='mix'?{id:'mix',name:'Mezcla',items:catList.flatMap(x=>x.items.map(i=>i))}:catList.find(x=>x.id===cat);cb({cat:c,secs,catId:cat})}
  });
}
const catOf=w=>{const c=CATS.find(c=>c.items.includes(w));return c?c.icon+' '+c.name:''};

const GAMES=[];const def=g=>GAMES.push(g);

def({id:'conoces',icon:'💭',name:'¿Cuánto me conoces?',c:'#a06bff',min:2,max:16,best:[2,3],desc:'Uno responde en secreto sobre sí mismo; el otro tiene que acertar.',
 rules:`<ol><li>Le toca a una persona: responde <b>en secreto</b> una pregunta sobre sí misma.</li><li>Pasa el móvil a la siguiente, que intenta adivinar qué ha elegido.</li><li>Si acierta, punto para quien adivina. Luego se cambian los papeles.</li></ol><p>Con más de 2, el resto puede apostar en voz alta antes de ver la respuesta.</p>`,
 start(){const g=this,sc=zero(),d=deck(CONOCES);let turn=0;
  const next=()=>{const N=P().length,subj=P()[turn%N],gs=P()[(turn+1)%N],q=d();
   passScreen(g,subj,'Vas a responder sobre ti. Que nadie mire 👀',()=>{
    screen(g,`<div class="center"><p class="lbl">Sobre ti, ${esc(subj)}</p><h2 class="q">${q[0]}</h2><div class="opts">${q[1].map((o,i)=>`<button class="opt" data-a="o" data-i="${i}">${o}</button>`).join('')}</div></div>`,{o:t=>{const a=+t.dataset.i;
     passScreen(g,gs,`¿Qué habrá respondido ${esc(subj)}?`,()=>{
      screen(g,`<div class="center"><p class="lbl">¿Qué ha elegido ${esc(subj)}?</p><h2 class="q">${q[0]}</h2><div class="opts">${q[1].map((o,i)=>`<button class="opt" data-a="o" data-i="${i}">${o}</button>`).join('')}</div></div>`,{o:t2=>{const b=+t2.dataset.i,ok=a===b;if(ok){sc[gs]++;confetti();beep(880,.2)}else{beep(180,.3);vib(200)}turn++;
       screen(g,`<div class="center"><h1 style="font-size:46px;margin:10px 0">${ok?'¡Bien visto! 🎯':'¡Fallo! 🙈'}</h1><p class="lbl">${q[0]}</p><div class="opts">${q[1].map((o,i)=>`<div class="opt ${i===a?'good':i===b?'wrong':''}">${o}${i===a?' · '+esc(subj):''}${i===b&&!ok?' · '+esc(gs):''}</div>`).join('')}</div><h3 style="margin-top:18px">Marcador</h3>${boardHTML(sc)}<button class="btn primary xl" data-a="n">Siguiente pregunta</button></div>`,{n:next})}})})}})})};
  next()}});

def({id:'onda',icon:'📡',name:'En la onda',c:'#3fd6ff',min:2,max:16,best:[2,6],desc:'Da una pista para que el otro coloque el dial en el punto exacto.',
 rules:`<ol><li>Quien da la pista ve en secreto un punto entre dos extremos (p. ej. <i>Frío ↔ Caliente</i>).</li><li>Dice <b>una</b> pista en voz alta que crea que cae justo ahí (p. ej. «un café recién hecho»).</li><li>El resto mueve el dial. Cuanto más cerca, más puntos: 4, 3 o 2.</li></ol><p>Es cooperativo: sumáis puntos en equipo. ¡Intentad batir vuestro récord!</p>`,
 start(){const g=this,d=deck(ONDA);let team=0,rounds=0,turn=0;
  const spec=(sp,t,v)=>`<div class="spec"><div class="bar">${t!=null?`<div class="z z2" style="left:${t-17}%;width:34%"></div><div class="z z3" style="left:${t-10}%;width:20%"></div><div class="z z4" style="left:${t-4}%;width:8%"></div>`:''}${v!=null?`<div class="needle" id="gm" style="left:${v}%"></div>`:''}</div><div class="ends"><span>⬅️ ${sp[0]}</span><span>${sp[1]} ➡️</span></div></div>`;
  const next=()=>{const name=P()[turn%P().length],sp=d(),t=6+rnd(89);
   passScreen(g,name,'Vas a dar la pista. Que nadie más mire.',()=>{
    screen(g,`<div class="center"><p class="lbl">Tu objetivo secreto</p>${spec(sp,t,null)}<p class="sub">Piensa <b>una sola pista</b> (cosa, persona, lugar…) que esté justo en la zona blanca entre <b>${sp[0]}</b> y <b>${sp[1]}</b>.</p><button class="btn primary xl" data-a="h">Ya la tengo · ocultar</button></div>`,{h:()=>guess(name,sp,t)})})};
  function guess(name,sp,t){screen(g,`<div class="center"><p class="lbl">${esc(name)} dice su pista en voz alta</p>${spec(sp,null,50)}<input type="range" id="rg" min="0" max="100" value="50"><p class="sub">${P().length>2?'Debatid y m':'M'}ueve el dial a donde creas que está.</p><button class="btn primary xl" data-a="f">Fijar respuesta</button></div>`,{f:()=>reveal(sp,t,+$('#rg').value)});
   $('#rg').addEventListener('input',e=>{$('#gm').style.left=e.target.value+'%'})}
  function reveal(sp,t,v){const df=Math.abs(t-v),pts=df<=4?4:df<=10?3:df<=17?2:0;team+=pts;rounds++;turn++;if(pts>=3)confetti();beep(pts?880:200,.25);
   screen(g,`<div class="center"><h1 style="font-size:64px;color:var(--yel)">+${pts}</h1><p class="sub">${pts===4?'¡En el clavo! 🎯':pts===3?'¡Muy cerca!':pts===2?'No está mal':'Ni de lejos 😅'}</p>${spec(sp,t,v)}<div class="stats">Equipo: <b>${team}</b> puntos en ${rounds} ronda${rounds>1?'s':''} · media ${(team/rounds).toFixed(1)}</div><button class="btn primary xl" data-a="n">Siguiente: ${esc(P()[turn%P().length])}</button></div>`,{n:next})}
  next()}});

def({id:'sincro',icon:'🧠',name:'Mentes gemelas',c:'#ff9a5c',min:2,max:16,best:[2,4],desc:'Decid a la vez una palabra de la categoría. ¿Coincidís?',
 rules:`<ol><li>Sale una categoría (p. ej. «Una fruta»).</li><li>Cuenta atrás y decís <b>a la vez</b> lo primero que se os ocurra.</li><li>Si no coincidís, podéis intentar <b>unir</b> vuestras dos palabras: a la de 3, decid algo que conecte ambas, y así hasta coincidir.</li></ol>`,
 start(){const g=this,d=deck(SINCRO);let m=0,tot=0,streak=0,best=0,tries=0;
  const stats=()=>`<div class="stats">Coincidencias ${m}/${tot} · Racha ${streak} · Mejor racha ${best}</div>`;
  const show=(c,link)=>{screen(g,`<div class="center"><p class="lbl">${link?'Intento '+(tries+1)+' · decid algo que una vuestras dos palabras':'Pensad en…'}</p><div class="card big"><div class="w">${link?'🔗':c}</div>${link?`<div class="hint">Categoría inicial: ${c}</div>`:''}</div><button class="btn primary xl" data-a="go">3, 2, 1…</button>${stats()}</div>`,{go:()=>countdown(g,()=>{
    screen(g,`<div class="center"><div class="count" style="margin-top:6vh;animation:none">¡YA!</div><p class="lbl">${link?'¿Habéis dicho lo mismo?':c}</p><div class="btns"><button class="btn ok" data-a="y">¡Coincidimos! 🎉</button><button class="btn no" data-a="n">Nada que ver</button></div></div>`,{
     y:()=>{m++;tot++;streak++;best=Math.max(best,streak);tries=0;confetti();beep(880,.3);show(d(),false)},
     n:()=>{tries++;beep(200,.2);screen(g,`<div class="center"><h1 style="font-size:44px;margin:20px 0">¡Casi! 😅</h1><p class="sub">Podéis intentar unir lo que habéis dicho, o pasar a otra categoría.</p><button class="btn primary xl" data-a="l">🔗 Intentar unirlas</button><button class="btn" data-a="s">Nueva categoría</button>${stats()}</div>`,{l:()=>show(c,true),s:()=>{tot++;streak=0;tries=0;show(d(),false)}})}})})})};
  show(d(),false)}});

def({id:'charla',icon:'☕',name:'Preguntas para hablar',c:'#22c58b',min:2,max:8,best:[2,3],desc:'Cartas de conversación: ligeras, profundas o sobre vosotros.',
 rules:`<p>Elegid un nivel y sacad cartas. Cada uno responde a la pregunta (o solo a quien le toque). Sin prisas: aquí no se gana, se charla.</p><ul><li><b>Ligero</b>: para romper el hielo.</li><li><b>Profundo</b>: para conoceros de verdad.</li><li><b>Entre nosotros</b>: preguntas sobre la otra persona.</li></ul>`,
 start(){const g=this,lv=Object.keys(CHARLA),decks={};lv.forEach(k=>decks[k]=deck(CHARLA[k]));let cur=lv[0],turn=0,n=0;
  const draw=()=>{const q=decks[cur]();const who=P()[turn%P().length];turn++;n++;
   screen(g,`<div class="seg">${lv.map(k=>`<button data-a="lv" data-k="${k}" class="${k===cur?'on':''}">${k}</button>`).join('')}</div><div class="card big"><p class="lbl">Responde ${esc(who)}</p><div class="txt">${q}</div></div><button class="btn primary xl" data-a="n">Otra pregunta</button><div class="stats center">${n} carta${n>1?'s':''}</div>`,{n:draw,lv:t=>{cur=t.dataset.k;draw()}})};

def({id:'frente',icon:'🤳',name:'En la frente',c:'#ffd23f',min:2,max:16,best:[2,8],desc:'Móvil en la frente: adivina la palabra con las pistas del resto.',
 rules:`<ol><li>Quien juega se pone el móvil en la frente, con la pantalla hacia el resto.</li><li>Los demás le dan pistas (sin decir la palabra) y pulsan <b>✓</b> si acierta o <b>Pasar</b>.</li><li>Cuando se acaba el tiempo, le toca al siguiente.</li></ol><p>En pareja: uno adivina y el otro da pistas y pulsa.</p>`,
 start(){const g=this;setupScreen(g,{cats:CATS,time:[45,60,90]},({cat,secs})=>{const d=deck(cat.items);

def({id:'tabu',icon:'🚫',name:'Palabras prohibidas',c:'#ff4d5e',min:2,max:16,best:[2,10],desc:'Describe la palabra sin decir las prohibidas.',
 rules:`<ol><li>Quien describe ve la palabra y 4 palabras prohibidas.</li><li>Tiene que hacer que el resto la adivine <b>sin decir ninguna prohibida</b> (ni la propia palabra).</li><li>✓ = +1 · Prohibida = −1 · Pasar = 0.</li></ol>`,

def({id:'dibuja',icon:'✏️',name:'Dibuja y adivina',c:'#3b82f6',min:2,max:12,best:[2,8],desc:'Dibuja en el móvil y que el resto lo adivine.',
 rules:`<ol><li>Quien dibuja mira su palabra en secreto.</li><li>Dibuja en la pantalla (sin letras ni números) mientras el resto intenta adivinar.</li><li>Si alguien acierta antes de que acabe el tiempo, punto para quien dibuja y para quien adivina.</li></ol>`,
 start(){const g=this,sc=zero(),d=deck(DIBUJA);let turn=0;
  const next=()=>{const name=P()[turn%P().length],w=d();
   passScreen(g,name,'Te toca dibujar. Mira tu palabra sin que nadie la vea.',()=>screen(g,`<div class="pass" style="padding-top:4vh"><p>Tu palabra es</p><div class="secret">${esc(w)}</div><p class="sub">Nada de letras ni números 😉 Tienes 75 segundos.</p><button class="btn primary xl" data-a="go">¡A dibujar!</button></div>`,{go:()=>draw(name,w)}))};
  function draw(name,w){let left=75,color='#111',size=6;const cols=['#111','#ff4d5e','#3b82f6','#22c58b','#ffb800','#a06bff'];
   screen(g,`<div class="tbar"><span class="who">✏️ ${esc(name)}</span><span class="timer" id="tm">${left}</span><button class="mini" data-a="clr">🗑️ Borrar</button></div><div class="pal">${cols.map((c,i)=>`<button data-a="col" data-c="${c}" style="background:${c}" class="${i?'':'on'}"></button>`).join('')}<button data-a="col" data-c="#ffffff" style="background:#fff;outline:1px solid #999" title="Goma"></button></div><canvas id="cv"></canvas><div class="btns"><button class="btn ok" data-a="got">¡Adivinado!</button><button class="btn no" data-a="fail">Rendirse</button></div>`,{
    clr:()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)},
    col:t=>{color=t.dataset.c;size=color==='#ffffff'?26:6;document.querySelectorAll('.pal button').forEach(b=>b.classList.toggle('on',b===t))},
    got:()=>{st();guessed(name,w)},fail:()=>{st();result(name,w,null)}});
   const cv=$('#cv'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';
   let drawing=false,lx=0,ly=0;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
   cv.addEventListener('pointerdown',e=>{drawing=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.fillStyle=color;ctx.arc(lx,ly,size/2,0,7);ctx.fill()});
   cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y});
   ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>drawing=false));
   const st=every(1000,()=>{left--;const tm=$('#tm');if(tm){tm.textContent=Math.max(0,left);if(left<=10)tm.classList.add('hot')}if(left<=0){st();beep(200,.5,'sawtooth');vib([200,100,200]);result(name,w,null)}})}
  function guessed(name,w){const others=P().filter(p=>p!==name);if(others.length===1){result(name,w,others[0]);return}
   screen(g,`<div class="center"><h2 style="margin:20px 0">¿Quién lo ha adivinado?</h2>${pickChips(others)}</div>`,{chip:t=>result(name,w,others[+t.dataset.i])})}
  function result(name,w,who){turn++;if(who){sc[name]++;sc[who]++;confetti();beep(880,.3)}
   screen(g,`<div class="res"><p class="lbl">La palabra era</p><h1>${esc(w)}</h1><p class="sub">${who?`¡${esc(who)} lo ha adivinado! +1 para los dos`:'Nadie lo ha adivinado 🙈'}</p><h3>Marcador</h3>${boardHTML(sc)}<button class="btn primary xl" data-a="n">Siguiente: ${esc(P()[turn%P().length])}</button></div>`,{n:next})}
  next()}});

def({id:'historias',icon:'📖',name:'Historias encadenadas',c:'#14b8a6',min:2,max:12,best:[2,6],desc:'Inventad una historia por turnos con palabras obligatorias.',
 rules:`<ol><li>Por turnos, cada uno añade una o dos frases a la historia.</li><li>Tu frase tiene que incluir la <b>palabra obligatoria</b> que te toque.</li><li>La última persona tiene que cerrar la historia. ¡Al final, votad la mejor frase!</li></ol>`,

def({id:'lobos',icon:'🐺',name:'Hombres lobo',c:'#475569',min:6,max:20,best:[7,20],desc:'Lobos contra pueblo. La app reparte papeles y guía al narrador.',
 rules:`<ol><li>Una persona hace de <b>narrador</b> (no juega). El resto recibe un papel secreto.</li><li><b>Noche</b>: todos cierran los ojos; los lobos eligen víctima, la vidente investiga y la médica salva a alguien.</li><li><b>Día</b>: se anuncia quién ha caído, se debate y se vota a quién eliminar.</li><li>Gana el pueblo si elimina a todos los lobos. Ganan los lobos si igualan en número al pueblo.</li></ol>`,
 start(){const g=this;
  screen(g,`<div class="center"><h2 style="margin:10px 0">¿Quién narra?</h2><p class="sub">El narrador no juega: guía la partida con esta app.</p>${pickChips(P())}</div>`,{chip:t=>deal(+t.dataset.i)});
  function deal(ni){const narr=P()[ni],pl=P().filter((_,i)=>i!==ni),N=pl.length,w=Math.max(1,Math.round(N/4));
   const roles=[];for(let i=0;i<w;i++)roles.push('lobo');roles.push('vidente');if(N>=6)roles.push('medica');while(roles.length<N)roles.push('aldeano');shuffle(roles);
   const R={lobo:['🐺','Lobo','Cada noche, elige con los otros lobos a una víctima. De día, disimula.'],vidente:['🔮','Vidente','Cada noche puedes descubrir si alguien es lobo.'],medica:['💉','Médica','Cada noche eliges a alguien para salvarle (puedes ser tú).'],aldeano:['🧑‍🌾','Aldeano','No tienes poderes. Usa tu instinto para encontrar a los lobos.']};
   let i=0;const dead=new Set();
   const next=()=>{const who=pl[i];passScreen(g,who,'Mira tu papel en secreto.',()=>{const r=R[roles[i]];
    screen(g,`<div class="center"><div style="font-size:100px;margin-top:20px">${r[0]}</div><h1 style="font-size:44px">${r[1]}</h1><p class="sub" style="max-width:320px;margin:10px auto 24px">${r[2]}</p><button class="btn primary xl" data-a="h">Ocultar y pasar</button></div>`,{h:()=>{i++;i<N?next():passScreen(g,narr,'Eres el narrador. Tienes el guion de la partida.',panel)}})})};
   const steps=[['🌙','Noche','«Se hace de noche. Todos cerramos los ojos.»'],['🐺','Lobos','«Lobos, abrid los ojos y elegid en silencio a una víctima señalándola…» (espera) «Lobos, cerrad los ojos.»'],['🔮','Vidente','«Vidente, abre los ojos y señala a alguien.» Indícale con el pulgar: arriba si es lobo, abajo si no. «Vidente, cierra los ojos.»']];
   if(roles.includes('medica'))steps.push(['💉','Médica','«Médica, abre los ojos y señala a quién quieres salvar esta noche.» «Médica, cierra los ojos.»']);
   steps.push(['☀️','Amanecer','«Se hace de día. Abrid los ojos.» Anuncia quién ha caído (salvo que la médica le salvara). Márcalo abajo.'],['🗳️','Juicio','Debate libre y votación. El eliminado revela su papel. Márcalo abajo y vuelve a la noche.']);
   let s=0,night=1,show=false;
   const panel=()=>{const alive=pl.filter(p=>!dead.has(p)),wl=alive.filter(p=>roles[pl.indexOf(p)]==='lobo').length,vl=alive.length-wl;
    const msg=wl===0?'🎉 ¡Gana el pueblo!':wl>=vl?'🐺 ¡Ganan los lobos!':'';
    screen(g,`<p class="lbl">Noche ${night} · Lobos vivos ${wl} · Pueblo vivo ${vl}</p>${msg?`<div class="win-msg">${msg}</div>`:''}${steps.map((st,k)=>`<div class="step ${k===s?'cur':''}"><b>${st[0]} ${st[1]}</b><div class="sub" style="margin-top:4px;color:var(--txt)">${st[2]}</div></div>`).join('')}<button class="btn primary xl" data-a="n">${s===steps.length-1?'🌙 Nueva noche':'Siguiente paso'}</button><p class="lbl" style="margin-top:18px">Jugadores (toca para eliminar)</p><div class="roles">${pl.map((p,k)=>`<button data-a="k" data-i="${k}" class="${dead.has(p)?'dead':''}">${show?R[roles[k]][0]+' ':''}${esc(p)}</button>`).join('')}</div><button class="btn ghost" data-a="sh">${show?'🙈 Ocultar papeles':'👁️ Ver papeles (solo narrador)'}</button><button class="btn" data-a="re">Nueva partida</button>`,{
     n:()=>{if(s===steps.length-1){s=0;night++}else s++;beep(600,.05);panel()},k:t=>{const p=pl[+t.dataset.i];dead.has(p)?dead.delete(p):dead.add(p);panel()},sh:()=>{show=!show;panel()},re:()=>g.start()})};
   next()}
 }});

def({id:'conecta4',icon:'🔴',name:'Cuatro en raya',c:'#2847d6',min:2,max:2,best:[2,2],desc:'El clásico duelo: une cuatro fichas antes que el otro.',
 rules:`<p>Tocad una columna para soltar ficha. Gana quien una 4 en horizontal, vertical o diagonal. En la revancha empieza el otro.</p>`,
 start(){const g=this,[a,b]=P(),wins=[0,0];let first=0;
  const game=()=>{const B=Array.from({length:6},()=>Array(7).fill(0));let cur=first,over=false,win=[];
   const check=(r,c,p)=>{for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let line=[[r,c]];for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&B[rr][cc]===p){line.push([rr,cc]);rr+=dr*s;cc+=dc*s}}if(line.length>=4)return line}return null};
   const render=(msg)=>{const nm=[a,b];screen(g,`<div class="center"><p style="font-weight:800;font-size:18px">${msg||`<span class="dot" style="background:${cur?'var(--yel)':'#ff4d5e'}"></span>Turno de ${esc(nm[cur])}`}</p><div class="c4">${B.map((row,r)=>row.map((v,c)=>`<button data-a="c" data-c="${c}" class="${v?'p'+v:''} ${win.some(([wr,wc])=>wr===r&&wc===c)?'win':''}"></button>`).join('')).join('')}</div><p class="stats"><span class="dot" style="background:#ff4d5e"></span>${esc(a)} ${wins[0]} — ${wins[1]} ${esc(b)}<span class="dot" style="background:var(--yel);margin:0 0 0 6px"></span></p>${over?'<button class="btn primary xl" data-a="r">Revancha</button>':''}</div>`,{
     c:t=>{if(over)return;const c=+t.dataset.c;let r=5;while(r>=0&&B[r][c])r--;if(r<0)return;B[r][c]=cur+1;beep(400+cur*200,.06);vib(15);const l=check(r,c,cur+1);
      if(l){over=true;win=l;wins[cur]++;confetti();beep(880,.4);render(`🏆 ¡Gana ${esc(nm[cur])}!`);return}
      if(B[0].every(x=>x)){over=true;render('🤝 ¡Empate!');return}cur=1-cur;render()},
     r:()=>{first=1-first;game()}})};render()};
  game()}});

def({id:'reflejos',icon:'⚡',name:'Duelo de reflejos',c:'#22c58b',min:2,max:2,best:[2,2],desc:'Móvil en medio, uno a cada lado. ¡Toca primero cuando se ponga verde!',

 start(){const g=this,nm=P(),sc=[0,0],GOAL=5;let state='idle';

  const du=$('#du'),msg=t=>{$('#m0').textContent=t;$('#m1').textContent=t};let stopT=null,t0=0;
  const round=()=>{state='wait';du.classList.remove('go');msg('Espera al verde…');stopT=later(1500+rnd(3500),()=>{state='go';t0=performance.now();du.classList.add('go');msg('¡YA!');beep(1200,.12)})};
  du.querySelectorAll('.half').forEach(h=>h.addEventListener('pointerdown',e=>{e.preventDefault();const p=+h.dataset.p;
   if(state==='idle'){round();return}
   if(state==='wait'){stopT&&stopT();state='done';const w=1-p;sc[w]++;vib(200);beep(180,.3);msg(`¡${nm[p]} se adelantó! Punto para ${nm[w]}`);fin()}
   else if(state==='go'){state='done';sc[p]++;const ms=Math.round(performance.now()-t0);beep(880,.15);vib(40);msg(`¡${nm[p]} gana! ${ms} ms`);fin()}

def({id:'naval',icon:'🚢',name:'Batalla naval',c:'#0ea5e9',min:2,max:2,best:[2,2],desc:'Coloca tu flota en secreto y hunde la del rival.',
 rules:`<ol><li>Cada uno ve en secreto dónde está su flota (la coloca la app; puedes recolocarla).</li><li>Por turnos, tocad una casilla del mar rival para disparar.</li><li>Si aciertas, repites. Gana quien hunda los 5 barcos del otro.</li></ol>`,
 start(){const g=this,nm=P(),SZ=8,SH=[4,3,2,2,1],B=[null,null];
  const S2=[0,1].map(()=>Array.from({length:SZ},()=>Array(SZ).fill(0)));
  const mk=()=>{const b=Array.from({length:SZ},()=>Array(SZ).fill(0));SH.forEach((len,si)=>{for(let tr=0;tr<800;tr++){const h=rnd(2),r=rnd(h?SZ:SZ-len+1),c=rnd(h?SZ-len+1:SZ),cells=[];let ok=true;
     for(let k=0;k<len;k++){const rr=r+(h?0:k),cc=c+(h?k:0);cells.push([rr,cc]);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const a=rr+dr,e=cc+dc;if(a>=0&&a<SZ&&e>=0&&e<SZ&&b[a][e])ok=false}}
     if(ok){cells.forEach(([a,e])=>b[a][e]=si+1);break}}});return b};
  const sunk=(p,id)=>{for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++)if(B[p][r][c]===id&&S2[p][r][c]!==2)return false;return true};

  const setup=p=>passScreen(g,nm[p],'Vas a ver tu flota. Que no mire el rival.',()=>{B[p]=mk();
    const show=()=>screen(g,`<div class="center"><p class="lbl">Tu flota, ${esc(nm[p])}</p>${grid(p,true,false)}<p class="sub">Barcos de 4, 3, 2, 2 y 1 casillas.</p><button class="btn" data-a="re">🔀 Recolocar</button><button class="btn primary xl" data-a="ok">Listo · ocultar</button></div>`,{re:()=>{B[p]=mk();show()},ok:()=>p===0?setup(1):turn(rnd(2),'')});show()});

     if(v){S2[en][r][c]=2;vib(60);beep(300,.2,'sawtooth');
      if(left(en)===0){confetti();screen(g,`<div class="center"><h1 style="font-size:40px;margin:10px 0">🏆 ¡Gana ${esc(nm[cur])}!</h1><p class="lbl">Flota de ${esc(nm[0])}</p>${grid(0,true,false)}<p class="lbl">Flota de ${esc(nm[1])}</p>${grid(1,true,false)}<button class="btn primary xl" data-a="re">Revancha</button></div>`,{re:()=>g.start()});return}
      turn(cur,sunk(en,v)?'☠️ ¡Hundido! Dispara otra vez':'💥 ¡Tocado! Dispara otra vez')}
     else{S2[en][r][c]=1;lock=true;t.className='miss';t.textContent='•';beep(200,.15);$('#nvm').textContent='🌊 Agua… le toca a '+nm[en];later(1100,()=>turn(en,''))}}})};
  setup(0)}});

def({id:'hockey',icon:'🏒',name:'Hockey de mesa',c:'#06b6d4',min:2,max:2,best:[2,2],desc:'Móvil en la mesa: cada uno mueve su mazo con el dedo.',
 rules:`<ol><li>Poned el móvil en la mesa entre los dos. Cada uno defiende su lado.</li><li>Mueve tu mazo con el dedo dentro de tu mitad y golpea el disco.</li><li>Gana quien marque 5 goles.</li></ol>`,
 start(){const g=this,nm=P(),sc=[0,0],GOAL=5;
  screen(g,`<canvas id="hk"></canvas>`);
  const cv=$('#hk'),W=cv.clientWidth||340,HH=cv.clientHeight||500,dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=HH*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const PR=W*.1,R=W*.055,GW=W*.44,gx0=(W-GW)/2,gx1=gx0+GW,MX=W*.055,COL=['#ff5c8a','#3fd6ff'];
  const pad=[{x:W/2,y:HH-PR*2.2,vx:0,vy:0},{x:W/2,y:PR*2.2,vx:0,vy:0}],pk={x:W/2,y:HH/2,vx:0,vy:0};
  let over=0,flash=0,raf=0,last=performance.now();
  const reset=to=>{pk.x=W/2;pk.y=HH/2+(to===0?1:-1)*HH*.13;pk.vx=pk.vy=0};
  reset(rnd(2));
  const mv=e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,now=performance.now();
   if(over){if(e.type==='pointerdown'&&now-over>1200){sc[0]=sc[1]=0;over=0;reset(rnd(2))}return}
   const i=y>HH/2?0:1,p=pad[i],nx=Math.max(PR,Math.min(W-PR,x)),ny=i===0?Math.max(HH/2+PR,Math.min(HH-PR,y)):Math.max(PR,Math.min(HH/2-PR,y)),dt=Math.max(8,now-(p.t||now-16));
   let vx=(nx-p.x)/dt*16,vy=(ny-p.y)/dt*16;const sp=Math.hypot(vx,vy);if(sp>28){vx*=28/sp;vy*=28/sp}
   p.vx=vx;p.vy=vy;p.x=nx;p.y=ny;p.t=now};
  cv.addEventListener('pointerdown',mv);cv.addEventListener('pointermove',mv);
  const goal=s=>{sc[s]++;flash=performance.now();beep(880,.3);vib(120);if(sc[s]>=GOAL){over=performance.now();confetti()}else reset(1-s)};
  const draw=()=>{ctx.clearRect(0,0,W,HH);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,HH/2);ctx.lineTo(W,HH/2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,HH/2,W*.16,0,7);ctx.stroke();
   ctx.lineWidth=8;ctx.lineCap='round';ctx.strokeStyle=COL[1];ctx.beginPath();ctx.moveTo(gx0,3);ctx.lineTo(gx1,3);ctx.stroke();ctx.strokeStyle=COL[0];ctx.beginPath();ctx.moveTo(gx0,HH-3);ctx.lineTo(gx1,HH-3);ctx.stroke();
   ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.14)';ctx.font='800 '+Math.round(W*.34)+'px "Baloo 2",sans-serif';
   ctx.fillText(sc[0],W/2,HH*.75);ctx.save();ctx.translate(W/2,HH*.25);ctx.rotate(Math.PI);ctx.fillText(sc[1],0,0);ctx.restore();
   ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='800 15px Nunito,sans-serif';ctx.fillText(nm[0],W/2,HH*.75+W*.2);ctx.save();ctx.translate(W/2,HH*.25-W*.2);ctx.rotate(Math.PI);ctx.fillText(nm[1],0,0);ctx.restore();
   pad.forEach((p,i)=>{ctx.fillStyle=COL[i];ctx.beginPath();ctx.arc(p.x,p.y,PR,0,7);ctx.fill();ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(p.x,p.y,PR*.45,0,7);ctx.fill()});
   ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(pk.x,pk.y,R,0,7);ctx.fill();
   if(over){ctx.fillStyle='rgba(5,6,20,.75)';ctx.fillRect(0,0,W,HH);const w=sc[0]>=GOAL?0:1;ctx.fillStyle='#ffd23f';ctx.font='800 30px "Baloo 2",sans-serif';ctx.fillText('🏆 ¡Gana '+nm[w]+'!',W/2,HH/2-18);ctx.fillStyle='#fff';ctx.font='800 16px Nunito,sans-serif';ctx.fillText('Toca para la revancha',W/2,HH/2+22)}
   else if(performance.now()-flash<900){ctx.fillStyle='#fff';ctx.font='800 44px "Baloo 2",sans-serif';ctx.fillText('¡GOL!',W/2,HH/2)}};
  const step=()=>{const now=performance.now(),k=Math.min(2.5,(now-last)/16.67);last=now;

def({id:'codigo',icon:'🔐',name:'Descifra el código',c:'#10b981',min:2,max:2,best:[2,2],desc:'Uno crea un código de colores; el otro lo descifra con pistas.',

 start(){const g=this,nm=P(),COL=['🔴','🟡','🟢','🔵','🟣','🟠'],wins=[0,0];let maker=0,mode='duo';

def({id:'cajas',icon:'🔲',name:'Puntos y cajas',c:'#eab308',min:2,max:3,best:[2,3],desc:'Traza líneas por turnos y cierra más cuadrados que nadie.',

 start(){const g=this,N=4,COLS=['#ff4d5e','#ffd23f','#3fd6ff'],nm=P();let first=0;
  const game=()=>{const h=Array.from({length:N+1},()=>Array(N).fill(-1)),v=Array.from({length:N},()=>Array(N+1).fill(-1)),bx=Array.from({length:N},()=>Array(N).fill(-1)),sc=nm.map(()=>0);let cur=first%nm.length,filled=0;
   const full=(r,c)=>r>=0&&r<N&&c>=0&&c<N&&h[r][c]>=0&&h[r+1][c]>=0&&v[r][c]>=0&&v[r][c+1]>=0;
   const render=()=>{let s='';for(let R=0;R<=2*N;R++)for(let C=0;C<=2*N;C++){const r=R>>1,c=C>>1;

     l:t=>{if(over)return;const r=+t.dataset.r,c=+t.dataset.c,isH=t.dataset.t==='h',arr=isH?h:v;if(arr[r][c]>=0)return;arr[r][c]=cur;let got=0;
      (isH?[[r-1,c],[r,c]]:[[r,c-1],[r,c]]).forEach(([a,b])=>{if(full(a,b)&&bx[a][b]<0){bx[a][b]=cur;sc[cur]++;filled++;got++}});

def({id:'ahorcado',icon:'🪢',name:'Ahorcado',c:'#84cc16',min:2,max:16,best:[2,6],desc:'Escribe tu propia palabra o frase y que la adivinen letra a letra.',

 start(){const g=this,sc=zero(),pool=CATS.flatMap(c=>c.items);let turn=0;

   const draw=()=>{const masked=up.split(' ').map(wd=>`<span>${[...wd].map(ch=>{const k=norm(ch);return !/[A-ZÑ]/.test(k)||got.has(k)||over?esc(ch):'_'}).join('')}</span>`).join('');

     n:next})};
   draw()};
  next()}});

def({id:'dados',icon:'🎲',name:'Dados mentirosos',c:'#b45309',min:2,max:8,best:[3,6],desc:'Dados ocultos, apuestas y faroles. ¿Quién miente?',

def({id:'clave',icon:'🔑',name:'Palabras en clave',c:'#dc2626',min:4,max:20,best:[4,12],desc:'Dos equipos: el capitán da pistas de una palabra para encontrar las suyas.',

 start(){const g=this,NM={R:'rojo',B:'azul'},pool=[...new Set(DIBUJA.concat(...['objetos','animales','comida','prof'].map(id=>CATS.find(c=>c.id===id).items)).filter(w=>!w.includes(' ')&&w.length<=10))];
  const game=()=>{const words=shuffle(pool.slice()).slice(0,25),st=rnd(2)?'R':'B',ot=st==='R'?'B':'R',key=shuffle([...Array(9).fill(st),...Array(8).fill(ot),...Array(7).fill('N'),'X']),open=Array(25).fill(false);let turn=st,winner='';
   const left=t=>key.filter((k,i)=>k===t&&!open[i]).length;
   const board=()=>screen(g,`<div class="row"><b style="color:#ff6b78">🔴 Rojo: ${left('R')}</b><b style="color:#7b9cff">🔵 Azul: ${left('B')}</b></div><p class="center" style="font-weight:800;font-size:18px;margin:8px 0">${winner?'🏆 ¡Gana el equipo '+NM[winner]+'!':(turn==='R'?'🔴':'🔵')+' Turno del equipo '+NM[turn]}</p><div class="cw">${words.map((w,i)=>`<button data-a="w" data-i="${i}" class="${open[i]||winner?key[i]:''}" ${winner&&!open[i]?'style="opacity:.55"':''}>${esc(w)}</button>`).join('')}</div>${winner?'<button class="btn primary xl" data-a="re">Otra partida</button>':'<button class="btn" data-a="pass">Pasar turno ➡️</button><button class="btn ghost" data-a="key">🔑 Ver clave (solo capitanes)</button>'}`,{
     w:t=>{const i=+t.dataset.i;if(winner||open[i])return;open[i]=true;const k=key[i],other=turn==='R'?'B':'R';
      if(k==='X'){winner=other;vib([300,100,300]);beep(100,.6,'sawtooth')}
      else{if(!left('R'))winner='R';else if(!left('B'))winner='B';if(k===turn)beep(880,.1);else{beep(250,.2);if(!winner)turn=other}if(winner)confetti()}
      board()},
     pass:()=>{turn=turn==='R'?'B':'R';board()},re:game,
     key:()=>screen(g,`<div class="pass"><div class="emoji">🔑</div><p>Solo para los</p><h1>Capitanes</h1><p class="sub">El resto, ¡no miréis!</p><button class="btn primary xl" data-a="ok">Ver clave</button><button class="btn ghost" data-a="b">Volver al tablero</button></div>`,{b:board,ok:()=>screen(g,`<p class="lbl center">Clave · empieza el equipo ${NM[st]}</p><div class="cw">${words.map((w,i)=>`<button class="${key[i]}" ${open[i]?'style="opacity:.35"':''}>${esc(w)}</button>`).join('')}</div><p class="sub center">Negra: pierdes al instante · Gris: neutral</p><button class="btn primary xl" data-a="b">Ocultar clave</button>`,{b:board})})});
   board()};
  game()}});

def({id:'quiz',icon:'🔔',name:'Quiz con pulsador',c:'#f59e0b',min:2,max:4,best:[2,4],desc:'Miles de preguntas en 10 categorías: responde quien pulse antes.',
 rules:`<ol><li>Elegid categoría (o mezcla). Sale una pregunta con 4 opciones y cada uno tiene su pulsador.</li><li>Quien pulse antes tiene 8 segundos para responder.</li><li>Acierto +1, fallo −1.</li></ol><p>Hay ${th2(QZ.length)} preguntas y las respuestas incorrectas cambian cada vez.</p>`,
 start(){const g=this,sc=zero(),COLS=['#ff4d5e','#3b6cf0','#22c58b','#f59e0b'],cats=[...new Set(QZ.map(q=>q[0]))],decks={};cats.forEach(c=>decks[c]=deck(QZ.filter(q=>q[0]===c)));let n=0,cat='mix';
  const next=()=>{const it=decks[cat==='mix'?cats[rnd(cats.length)]:cat](),q=[it[1]],ans=it[2],opts=shuffle([ans,...it[3]()]);n++;
   const oh=(click,shown,pick)=>`<div class="opts">${opts.map((o,i)=>click?`<button class="opt" data-a="o" data-i="${i}">${esc(o)}</button>`:`<div class="opt ${shown&&o===ans?'good':shown&&pick===o?'wrong':''}">${esc(o)}</div>`).join('')}</div>`;
   const res=(who,pick)=>{const ok=pick===ans;if(who)sc[who]+=ok?1:-1;if(ok){confetti();beep(880,.2)}else{beep(180,.3);vib(150)}
    screen(g,`<div class="center"><h1 style="font-size:32px;margin:8px 0">${!who?'La respuesta era…':ok?'✅ ¡Correcto, '+esc(who)+'!':pick===''?'⏰ ¡Tiempo! −1 para '+esc(who):'❌ ¡Fallo! −1 para '+esc(who)}</h1><p class="lbl">${esc(q[0])}</p>${oh(false,true,pick)}<h3 style="margin-top:14px">Marcador</h3>${boardHTML(sc)}<button class="btn primary xl" data-a="n">Siguiente pregunta</button><button class="btn ghost" data-a="c">Cambiar categoría</button></div>`,{n:next,c:choose})};
   const answer=pi=>{const who=P()[pi];let left=8;
    screen(g,`<div class="center"><div class="tbar"><span class="who">🔔 ${esc(who)} responde</span><span class="timer" id="tm">8</span></div><h2 class="q" style="font-size:24px">${esc(q[0])}</h2>${oh(true)}</div>`,{o:t=>{st();res(who,opts[+t.dataset.i])}});
    const st=every(1000,()=>{left--;const tm=$('#tm');if(tm){tm.textContent=Math.max(0,left);if(left<=3)tm.classList.add('hot')}if(left<=0){st();res(who,'')}})};
   screen(g,`<div class="center"><p class="lbl">Pregunta ${n} · ${QZ_ICON[it[0]]||''} ${it[0]}</p><h2 class="q" style="font-size:24px">${esc(q[0])}</h2>${oh(false,false)}<p class="sub" style="margin-top:10px">¡Pulsa tu botón si la sabes!</p><div class="buzz">${P().map((p,i)=>`<button data-p="${i}" style="background:${COLS[i]}">🔔 ${esc(p)}</button>`).join('')}</div><button class="btn ghost" data-a="x">Nadie la sabe</button></div>`,{x:()=>res(null,null)});
   let done=false;document.querySelectorAll('.buzz button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(done)return;done=true;beep(900,.15);vib(40);answer(+b.dataset.p)}))};
  const choose=()=>screen(g,`<p class="lbl">Categoría · ${th2(QZ.length)} preguntas</p><div class="cats">${cats.map(c=>`<button data-a="cat" data-id="${c}" class="${c===cat?'on':''}">${QZ_ICON[c]||''} ${c}<br><small style="opacity:.7">${th2(QZ.filter(q=>q[0]===c).length)}</small></button>`).join('')}</div><button class="btn ${cat==='mix'?'primary':''}" data-a="cat" data-id="mix">🎲 Mezcla de todo</button><button class="btn primary xl" data-a="go" style="margin-top:16px">¡Empezar!</button>`,{cat:t=>{cat=t.dataset.id;choose()},go:next});
  choose()}});
function th2(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
(()=>{const i=GAMES.findIndex(g=>g.id==='quiz'),j=GAMES.map(g=>g.id).lastIndexOf('quiz');if(i!==j)GAMES.splice(i,1,GAMES.splice(j,1)[0])})();
/* ================= INICIO ================= */
function home(){clearAll();CUR=null;const n=S.names.length,ps=P();
 const ok=GAMES.filter(g=>n>=g.min&&n<=g.max),best=ok.filter(g=>n>=g.best[0]&&n<=g.best[1]),also=ok.filter(g=>!best.includes(g)),no=GAMES.filter(g=>!ok.includes(g));
 const card=(g,off)=>`<button class="gc ${off?'off':''}" style="--c:${g.c}" data-a="${off?'nope':'open'}" data-id="${g.id}">${off?`<span class="bd">${n<g.min?'desde '+g.min:'solo '+g.max}</span>`:g.best[0]<=2&&g.best[1]<=3&&n===2?'<span class="star">Ideal 2</span>':''}<span class="ic">${g.icon}</span><h4>${g.name}</h4><p>${g.desc}</p></button>`;
 H={
  minus:()=>{if(S.names.length>2){S.names.pop();save();home()}},
  plus:()=>{if(S.names.length<20){S.names.push('');save();home();setTimeout(()=>{const ins=document.querySelectorAll('.names input');ins[ins.length-1]&&ins[ins.length-1].focus()},50)}},
  open:t=>intro(GAMES.find(g=>g.id===t.dataset.id)),
  nope:t=>{const g=GAMES.find(x=>x.id===t.dataset.id);vib(60);rules(g)},
  rand:()=>{if(!ok.length)return;const el=$('#rand');let k=0;const pool=best.length?best:ok;const st=every(90,()=>{const g=pool[k++%pool.length];el.textContent=g.icon+' '+g.name;beep(400+(k%5)*80,.03);if(k>14+rnd(pool.length)){st();vib(60);setTimeout(()=>intro(g),500)}})}
 };
 app.innerHTML=`<header class="hero"><div class="logo">🎲</div><h1>¿Jugamos?</h1><p>${GAMES.length} juegos para quedadas · un solo móvil</p></header>
 <section class="panel"><div class="row"><h3>¿Cuántos sois?</h3><div class="stepper"><button data-a="minus" aria-label="Menos">−</button><b>${n}</b><button data-a="plus" aria-label="Más">+</button></div></div>
 <div class="names">${S.names.map((v,i)=>`<input data-i="${i}" value="${esc(v)}" placeholder="Jugador ${i+1}" maxlength="16" autocomplete="off">`).join('')}</div></section>
 <button class="random" data-a="rand" id="rand">🎰 ¡Que elija la app!</button>
 ${best.length?`<div class="sec"><h3>${n===2?'Perfectos para dos':'Perfectos para '+n}</h3><span>${best.length}</span></div><div class="grid">${best.map(g=>card(g)).join('')}</div>`:''}
 ${also.length?`<div class="sec"><h3>También funcionan</h3><span>${also.length}</span></div><div class="grid">${also.map(g=>card(g)).join('')}</div>`:''}
 ${no.length?`<div class="sec"><h3>${no.some(g=>n<g.min)?'Necesitáis más gente':'No disponibles'}</h3><span>${no.length}</span></div><div class="grid">${no.map(g=>card(g,true)).join('')}</div>`:''}
 <p class="foot">Los nombres se guardan solo en este móvil.</p>`;
 app.querySelectorAll('.names input').forEach(inp=>inp.addEventListener('input',e=>{S.names[+e.target.dataset.i]=e.target.value;save()}));
 window.scrollTo(0,0);
}
function intro(g){screen(g,`<div class="intro"><div class="ic">${g.icon}</div><h1>${g.name}</h1><div class="tags"><span class="tag">👥 ${g.min===g.max?g.min:g.min+(g.max>=16?'+':'–'+g.max)} jugadores</span><span class="tag">⭐ Mejor con ${g.best[0]===g.best[1]?g.best[0]:g.best[0]+'–'+g.best[1]}</span></div><div class="rules">${g.rules}</div><button class="btn primary xl" data-a="go">¡A jugar!</button></div>`,{go:()=>{beep(700,.05);g.start()}})}
home();
</script>
</body>
</html>
